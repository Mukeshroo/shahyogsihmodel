    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  <body class="bg-[#F7F9FC] text-[#12304A] antialiased selection:bg-[#087F5B] selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
